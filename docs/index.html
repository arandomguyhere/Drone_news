<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber News - September 06, 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            border-bottom: 1px solid #222;
            padding: 30px 0;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2em;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        header .meta {
            color: #888;
            font-size: 0.9em;
        }

        header .meta a {
            color: #4ade80;
            text-decoration: none;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .stat {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #4ade80;
        }

        .stat-label {
            font-size: 0.8em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .category {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #fff;
            padding: 12px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-count {
            font-size: 0.8em;
            color: #888;
            font-weight: 400;
        }

        .articles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }

        .article {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 18px;
            transition: border-color 0.2s;
        }

        .article:hover {
            border-color: #333;
        }

        .article-title {
            font-weight: 500;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .article-title a {
            color: #e0e0e0;
            text-decoration: none;
        }

        .article-title a:hover {
            color: #4ade80;
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #666;
        }

        .source {
            color: #4ade80;
        }

        footer {
            border-top: 1px solid #222;
            padding: 30px 0;
            margin-top: 40px;
            text-align: center;
            color: #666;
            font-size: 0.85em;
        }

        footer a {
            color: #4ade80;
            text-decoration: none;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        @media (max-width: 600px) {
            .articles {
                grid-template-columns: 1fr;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Cyber News Brief</h1>
            <div class="meta">
                September 06, 2026 &bull; 20:18 UTC &bull;
                <a href="https://github.com/arandomguyhere/Drone_news">GitHub</a>
            </div>
        </header>

        <div class="stats">
            <div class="stat">
                <div class="stat-value">0</div>
                <div class="stat-label">Articles</div>
            </div>
            <div class="stat">
                <div class="stat-value">0</div>
                <div class="stat-label">Sources</div>
            </div>
            <div class="stat">
                <div class="stat-value">0</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat">
                <div class="stat-value">0</div>
                <div class="stat-label">Threat Intel</div>
            </div>
        </div>

        <div class="no-data">
            <p>No articles available. Check back soon.</p>
        </div>

        <footer>
            Updated every 6 hours &bull;
            <a href="https://github.com/arandomguyhere/Drone_news">View on GitHub</a>
        </footer>
    </div>
</body>
</html>
